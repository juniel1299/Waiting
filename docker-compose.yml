# 폴더명이 한글이라 기본 프로젝트명이 비므로 명시
name: daumjari

services:
  postgres:
    image: postgres:16
    container_name: daumjari-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daumjari}
      POSTGRES_USER: ${POSTGRES_USER:-daumjari}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daumjari}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - daumjari-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  daumjari-pgdata:
